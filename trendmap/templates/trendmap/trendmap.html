{% extends "base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<link rel="stylesheet" href="{% static 'trendmap.css' %}">

<h1>{{ template_data.title }}</h1>

<div id="trendmap-container">
  <div id="map"></div>

  <aside id="region-panel">
    <h2>Selected Region</h2>
    <div id="region-info">Click a continent to view trending movies here.</div>
    <hr/>
    <h3>Placeholder: Trending Movies</h3>
    <div id="trending-placeholder">
      <p>No region selected.</p>
    </div>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{% static 'trendmap.js' %}"></script>
{% endblock %}
