{% extends "base.html" %}
{% block content %}
<div class="p-3">
  <div class="container">
    <div class="row mt-3 justify-content-center">
      <div class="col-md-8">
        <h2>Create Petition</h2>
        <hr />
        <div class="card shadow p-3 rounded">
          <div class="card-body">
            <form method="post">
              {% csrf_token %}
              <div class="mb-3">
                <label for="id_title" class="form-label">Title</label>
                {{ form.title }}
              </div>
              <div class="mb-3">
                <label for="id_description" class="form-label">Description</label>
                {{ form.description }}
              </div>
              <div class="text-center">
                <button type="submit" class="btn bg-dark text-white">Submit Petition</button>
                <a href="{% url 'petition_list' %}" class="btn btn-secondary">Cancel</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
